name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Check the tag matches the project version
        run: |
          revision=$(./mvnw -q -N -DforceStdout help:evaluate -Dexpression=revision)
          if [ "v$revision" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match revision $revision in pom.xml" >&2
            exit 1
          fi

      - run: ./mvnw -B package

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes target/*.jar
